# ─── Modern Termux Configuration ────────────────────────────────────────────

# Extra keys: two rows with useful keys for coding
extra-keys = [[ \
  ESC, TAB, CTRL, ALT, {key: '-', popup: '|'}, {key: '/', popup: '\\\\'}, HOME, UP, END, PGUP \
], [ \
  SHIFT, KEYBOARD, \
  {key: '(', popup: '{'}, {key: ')', popup: '}'}, \
  {key: '~', popup: '`'}, {key: '_', popup: '='}, \
  LEFT, DOWN, RIGHT, PGDN \
]]

# Terminal colors: use system theme
use-black-ui = false

# Scrollback
terminal-transcript-rows = 5000

# Cursor: block with blink
terminal-cursor-style = block
terminal-cursor-blink-rate = 500

# Bell: vibrate
bell-character = vibrate

# Volume keys for extra keys by default
volume-keys = extra

# Back key sends Escape
back-key = escape

# Hide keyboard on start
hide-soft-keyboard-on-startup = false

# Allow external apps to share content with Termux
allow-external-apps = true

# Fullscreen
fullscreen = false
